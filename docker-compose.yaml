services:
  backend:
    build: ./backend/smart-profile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/smartprofile
    volumes:
      - backend-data:/data
    ports:
      - "8080:8080"  

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  backend-data:
