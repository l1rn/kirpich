spring:
  application:
    name: smart-profile
  config:
    import: classpath:credit-policy.yml
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/credit}
    username: ${DB_USER:credit}
    password: ${DB_PASSWORD:credit}
  jpa:
    hibernate:
      ddl-auto: none   # схемой управляет Flyway (db/migration)
    open-in-view: true # ответы API собираются из ленивых связей в контроллерах
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: 8080

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    ttl: 8h
  registry:
    base-url: ${REGISTRY_BASE_URL:http://localhost:8089}
    timeout: 3s
    max-attempts: 3
  pipeline:
    enabled: true
    step-delay-ms: ${PIPELINE_STEP_DELAY_MS:1500}
  upload-dir: ${UPLOAD_DIR:./data/uploads}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
  seed:
    enabled: ${SEED_DEMO_DATA:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
