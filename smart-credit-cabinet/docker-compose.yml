# Запуск всего стенда одной командой: docker compose up --build
# Значения по умолчанию — только для демо. Для своего стенда задайте их в .env (см. .env.example).
name: smart-credit-cabinet

services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-credit}
      POSTGRES_USER: ${DB_USER:-credit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-credit-demo-only}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Заглушки ЕГРЮЛ/ЕГРИП, ФНС «Прозрачный бизнес» и БКИ: сценарий зависит от ИНН (mocks/mappings)
  mocks:
    image: wiremock/wiremock:3.13.2
    command: ["--disable-banner"]
    volumes:
      - ./mocks:/home/wiremock
    ports:
      - "8089:8080"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      mocks:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-credit}
      DB_USER: ${DB_USER:-credit}
      DB_PASSWORD: ${DB_PASSWORD:-credit-demo-only}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-demo-only-secret-change-me-0123456789abcdef}
      REGISTRY_BASE_URL: http://mocks:8080
      PIPELINE_STEP_DELAY_MS: ${PIPELINE_STEP_DELAY_MS:-1500}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    volumes:
      - uploads:/data/uploads
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_DEMO_PASSWORD: ${VITE_DEMO_PASSWORD:-demo}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  db-data:
  uploads:
